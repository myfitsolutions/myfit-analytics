services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: myfit_analytics_test
      POSTGRES_USER: myfit_test
      POSTGRES_PASSWORD: myfit_test_only
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfit_test -d myfit_analytics_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
